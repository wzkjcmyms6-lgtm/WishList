<title>Nuestra Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --cream: #FBF3E7;
  --page-bg: #E9E2D6;
  --ink: #1F1B16;
  --muted: #8A8074;
  --card: #FFFFFF;
  --border: #E6DCC9;
  --chip-bg: #EFE6D6;
  --pink: #F4A6C6;
  --pink-deep: #C24B7C;
  --pink-soft: #FCE3ED;
  --blue: #9FD8D0;
  --blue-deep: #2F7A73;
  --blue-soft: #E1F4F0;
  --danger: #E15B5B;
  --danger-soft: #FBE4E4;
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cream: #24201B;
    --page-bg: #171310;
    --ink: #F3ECE1;
    --muted: #B7AA98;
    --card: #322B24;
    --border: #463D33;
    --chip-bg: #3A322A;
    --pink: #E28AB0;
    --pink-deep: #F0A8C6;
    --pink-soft: #4A2E3A;
    --blue: #6FBAB0;
    --blue-deep: #8FE0D0;
    --blue-soft: #23413D;
    --danger: #FF9494;
    --danger-soft: #4A2626;
  }
}

:root[data-theme="dark"] {
  --cream: #24201B;
  --page-bg: #171310;
  --ink: #F3ECE1;
  --muted: #B7AA98;
  --card: #322B24;
  --border: #463D33;
  --chip-bg: #3A322A;
  --pink: #E28AB0;
  --pink-deep: #F0A8C6;
  --pink-soft: #4A2E3A;
  --blue: #6FBAB0;
  --blue-deep: #8FE0D0;
  --blue-soft: #23413D;
  --danger: #FF9494;
  --danger-soft: #4A2626;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--page-bg);
  font-family: var(--font-body);
  color: var(--ink);
}

.app {
  max-width: 460px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--cream);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.pin-key, .tab-btn, .icon-btn, .reserve-btn, .fab, .btn,
.logout-btn, .sort-chip, .upload-btn, .nav-item {
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.pin-key:active, .tab-btn:active, .icon-btn:active, .reserve-btn:active,
.fab:active, .btn:active, .logout-btn:active, .sort-chip:active,
.upload-btn:active, .nav-item:active { transform: scale(0.93); }

input, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
input:focus, textarea:focus { outline: 2px solid var(--pink-deep); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.screen-login { animation: fadeSlideUp 0.35s ease both; flex: 1; display: flex; flex-direction: column; padding: 32px 24px 24px; }
.login-title { font-family: var(--font-heading); font-size: 30px; font-weight: 800; line-height: 1.15; margin: 12px 0 4px; text-wrap: balance; }
.login-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
.profile-cards { display: flex; flex-direction: column; gap: 18px; }
.profile-card { border-radius: var(--radius-lg); padding: 26px 22px; display: flex; align-items: center; gap: 16px; text-align: left; box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
.profile-card.theme-pink { background: linear-gradient(135deg, #F4A6C6 0%, #C24B7C 100%); color: #fff; }
.profile-card.theme-blue { background: linear-gradient(135deg, #9FD8D0 0%, #2F7A73 100%); color: #fff; }
.profile-avatar { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.profile-name { font-family: var(--font-heading); font-size: 22px; font-weight: 800; }
.profile-hint { font-size: 13px; opacity: 0.85; margin-top: 2px; }

.screen-pin { animation: fadeSlideUp 0.3s ease both; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 24px 32px; }
.pin-back { align-self: flex-start; font-size: 15px; font-weight: 600; color: var(--muted); padding: 8px 0; display: flex; align-items: center; gap: 6px; }
.pin-avatar { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-top: 12px; color: #fff; }
.pin-avatar.theme-pink { background: linear-gradient(135deg, #F4A6C6, #C24B7C); }
.pin-avatar.theme-blue { background: linear-gradient(135deg, #9FD8D0, #2F7A73); }
.pin-greeting { font-family: var(--font-heading); font-size: 20px; font-weight: 800; margin-top: 14px; }
.pin-instruction { color: var(--muted); font-size: 14px; margin-top: 4px; margin-bottom: 22px; }
.pin-dots { display: flex; gap: 16px; margin-bottom: 30px; height: 18px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); transition: all 0.12s ease; }
.pin-dot.filled { background: var(--ink); border-color: var(--ink); }
.pin-dot.error { border-color: var(--danger); background: var(--danger); animation: shake 0.3s ease; }
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 300px; margin-top: auto; }
.pin-key { aspect-ratio: 1; border-radius: 50%; background: var(--card); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
.pin-key.ghost { background: transparent; box-shadow: none; font-size: 15px; color: var(--muted); }

.screen-dashboard { animation: fadeSlideUp 0.3s ease both; flex: 1; display: flex; flex-direction: column; padding-bottom: 90px; }
.dash-header { padding: 22px 22px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
.dash-greeting { font-family: var(--font-heading); font-size: 22px; font-weight: 800; }
.dash-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.logout-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
.tabs { display: flex; margin: 4px 22px 18px; background: var(--chip-bg); border-radius: 999px; padding: 4px; }
.tab-btn { flex: 1; padding: 10px 8px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; }
.tab-btn.active { background: var(--ink); color: var(--cream); }
.items-list { padding: 0 22px; display: flex; flex-direction: column; gap: 14px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state.small { padding: 36px 20px; }
.empty-emoji { font-size: 42px; margin-bottom: 10px; }
.item-card { background: var(--card); border-radius: var(--radius-md); padding: 16px; display: flex; gap: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.14); position: relative; }
.item-card.card-enter { animation: cardIn 0.35s ease both; }
.item-thumb { width: 64px; height: 64px; border-radius: var(--radius-sm); background: var(--pink-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; }
.item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-family: var(--font-heading); font-weight: 700; font-size: 15.5px; margin-bottom: 3px; word-break: break-word; }
.item-desc { color: var(--muted); font-size: 13px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.item-price { font-weight: 800; font-size: 14px; color: var(--pink-deep); }
.item-link { font-size: 12.5px; color: var(--blue-deep); font-weight: 600; text-decoration: none; }
.item-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--chip-bg); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.icon-btn.danger { background: var(--danger-soft); }
.reserve-btn { margin-top: 10px; align-self: flex-start; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--blue-soft); color: var(--blue-deep); display: flex; align-items: center; gap: 6px; }
.reserve-btn.reserved { background: var(--blue-deep); color: var(--cream); }
.reserved-by-other { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fab { position: absolute; bottom: 96px; right: 22px; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: var(--cream); font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(0,0,0,0.3); z-index: 5; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px; background: var(--card); padding: 14px 30px calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; box-shadow: 0 -4px 16px rgba(0,0,0,0.14); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.nav-item.active { color: var(--ink); }
.nav-icon { font-size: 19px; }

.list-controls { padding: 0 22px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 10px 16px; box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
.search-icon { font-size: 14px; opacity: 0.7; }
.search-input { flex: 1; border: none; outline: none; background: transparent; font-size: 14.5px; color: var(--ink); }
.sort-chips { display: flex; gap: 8px; overflow-x: auto; }
.sort-chip { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); font-size: 12.5px; font-weight: 700; }
.sort-chip.active { background: var(--ink); color: var(--cream); }

.sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: overlayIn 0.2s ease both; }
.sheet { width: 100%; max-width: 460px; background: var(--cream); border-radius: 28px 28px 0 0; padding: 20px 22px calc(24px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: sheetIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
.sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.sheet-title { font-family: var(--font-heading); font-size: 19px; font-weight: 800; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.field input, .field textarea { width: 100%; padding: 13px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); color: var(--ink); }
.field textarea { resize: none; min-height: 70px; }
.upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius-sm); border: 1.5px dashed var(--border); background: var(--card); color: var(--muted); font-weight: 600; font-size: 14px; text-align: center; cursor: pointer; }
.upload-btn.disabled { opacity: 0.6; cursor: default; }
.field .upload-btn + input { margin-top: 10px; }
.image-preview { position: relative; border-radius: var(--radius-md); overflow: hidden; background: var(--card); }
.image-preview img { width: 100%; height: 180px; object-fit: cover; display: block; }
.image-remove { position: absolute; bottom: 10px; right: 10px; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,0.65); color: #fff; font-size: 12.5px; font-weight: 700; }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }
.sheet-actions { display: flex; gap: 12px; margin-top: 8px; }
.btn { flex: 1; padding: 14px; border-radius: 999px; font-weight: 700; font-size: 15px; text-align: center; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-secondary { background: var(--chip-bg); color: var(--ink); }
.btn-danger-text { color: var(--danger); background: var(--danger-soft); }
.btn-danger-solid { background: var(--danger); color: #fff; }

.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 24px; animation: overlayIn 0.15s ease both; }
.confirm-box { width: 100%; max-width: 360px; background: var(--cream); border-radius: var(--radius-md); padding: 22px; animation: popIn 0.2s ease both; }
.confirm-message { font-size: 15px; font-weight: 600; margin-bottom: 18px; line-height: 1.4; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 12px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 100; box-shadow: 0 8px 20px rgba(0,0,0,0.3); animation: toastIn 0.2s ease; max-width: 85%; text-align: center; }
.error-text { color: var(--danger); font-size: 13px; margin-top: 6px; text-align: center; min-height: 18px; }
.share-note { margin: 0 22px 10px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--blue-soft); color: var(--blue-deep); font-size: 12.5px; font-weight: 600; line-height: 1.4; }
</style>
<div id="app" class="app"></div>
<script type="application/json" id="app-data">{"items":[]}</script>
<script id="app-script">
(function () {
  'use strict';

  var root = document.getElementById('app');

  var PROFILES = {
    lentina: { id: 'lentina', name: 'Lentina', pin: '3103', emoji: '🐻‍❄️', theme: 'pink' },
    manolo: { id: 'manolo', name: 'Manuelito', pin: '0701', emoji: '🐻', theme: 'blue' }
  };

  function loadInitialItems() {
    try {
      var raw = document.getElementById('app-data').textContent;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed.items) ? parsed.items : [];
    } catch (e) {
      return [];
    }
  }

  var CSS_TEXT = document.querySelector('style').textContent;
  var APP_JS_TEXT = document.getElementById('app-script').textContent;

  var state = {
    items: loadInitialItems(),
    session: loadSession(),
    pinTarget: null,
    pinBuffer: '',
    pinError: false,
    activeTab: 'mine',
    search: '',
    sortBy: 'recent',
    sheet: null,
    confirm: null,
    toast: null,
    saving: false,
    writable: null
  };

  function loadSession() {
    try {
      var raw = localStorage.getItem('wishlist_session_v1');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveSession(profileId) {
    state.session = profileId;
    try { localStorage.setItem('wishlist_session_v1', JSON.stringify(profileId)); } catch (e) {}
  }
  function clearSession() {
    state.session = null;
    try { localStorage.removeItem('wishlist_session_v1'); } catch (e) {}
  }

  function buildDocument(items) {
    var json = JSON.stringify({ items: items }).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Nuestra Wishlist</title>\n<style>' + CSS_TEXT + '</style>\n</head>\n<body>\n<div id="app" class="app"></div>\n<script type="application/json" id="app-data">' + json + '<' + '/script>\n<script id="app-script">' + APP_JS_TEXT + '<' + '/script>\n</body>\n</html>';
  }

  var artifactCap = null;
  var artifactReady = (function () {
    if (!window.claude || !window.claude.use) return Promise.resolve(null);
    return window.claude.use('artifact').then(function (cap) {
      artifactCap = cap;
      state.writable = !!cap;
      render();
      return cap;
    }).catch(function () {
      state.writable = false;
      render();
      return null;
    });
  })();

  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { state.toast = null; render(); }, 2200);
  }

  async function publishItems() {
    state.saving = true;
    render();
    try {
      var cap = artifactCap || (await artifactReady);
      if (!cap) {
        showToast('No se pudo conectar al modo compartido. Los cambios quedan solo en este celular por ahora.');
        state.saving = false;
        render();
        return;
      }
      await cap.publish(buildDocument(state.items));
      // A successful publish reloads this view automatically.
    } catch (err) {
      state.saving = false;
      var code = err && err.code;
      if (code === 'conflict') {
        // The view is already reloading to the winning version.
        return;
      } else if (code === 'not_writer' || code === 'not_granted') {
        showToast('No tenés permiso de edición en este link. Pedile a quien lo compartió que te dé acceso para editar.');
      } else {
        showToast('No se pudo guardar. Probá de nuevo en un momento.');
      }
      render();
    }
  }

  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function compressImageFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('No se pudo leer la imagen')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Formato de imagen no soportado')); };
        img.onload = function () {
          var maxDim = 800;
          var w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.62));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function formatPrice(price) {
    var trimmed = String(price || '').trim();
    if (!trimmed) return '';
    return /^bs\.?\s*/i.test(trimmed) ? trimmed : 'Bs ' + trimmed;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function myItems() { return state.items.filter(function (it) { return it.owner === state.session; }); }
  function partnerId() { return state.session === 'lentina' ? 'manolo' : 'lentina'; }
  function partnerItems() { var pid = partnerId(); return state.items.filter(function (it) { return it.owner === pid; }); }

  function filterAndSort(items) {
    var q = state.search.trim().toLowerCase();
    var result = q ? items.filter(function (it) { return it.title.toLowerCase().indexOf(q) !== -1; }) : items.slice();
    function priceValue(it) {
      var n = parseFloat(String(it.price || '').replace(/[^\d.,]/g, '').replace(',', '.'));
      return isFinite(n) ? n : null;
    }
    if (state.sortBy === 'price-asc' || state.sortBy === 'price-desc') {
      var dir = state.sortBy === 'price-asc' ? 1 : -1;
      result.sort(function (a, b) {
        var pa = priceValue(a), pb = priceValue(b);
        if (pa === null && pb === null) return 0;
        if (pa === null) return 1;
        if (pb === null) return -1;
        return (pa - pb) * dir;
      });
    } else {
      result.sort(function (a, b) { return b.createdAt - a.createdAt; });
    }
    return result;
  }

  // ---------- Actions ----------
  function openPin(profile) { state.pinTarget = profile; state.pinBuffer = ''; state.pinError = false; render(); }
  function backToProfiles() { state.pinTarget = null; state.pinBuffer = ''; state.pinError = false; render(); }

  function pressDigit(d) {
    if (state.pinBuffer.length >= 4) return;
    state.pinBuffer += d;
    render();
    if (state.pinBuffer.length === 4) {
      var profile = state.pinTarget;
      if (state.pinBuffer === profile.pin) {
        saveSession(profile.id);
        state.pinTarget = null;
        state.pinBuffer = '';
        state.activeTab = 'mine';
        render();
      } else {
        state.pinError = true;
        render();
        setTimeout(function () { state.pinBuffer = ''; state.pinError = false; render(); }, 450);
      }
    }
  }

  function logout() {
    clearSession();
    state.activeTab = 'mine';
    state.search = '';
    state.sortBy = 'recent';
    render();
  }

  function switchTab(tab) { state.activeTab = tab; state.search = ''; state.sortBy = 'recent'; render(); }

  function openAddSheet() {
    state.sheet = { mode: 'add', item: { title: '', description: '', price: '', url: '', image: '' }, uploading: false };
    render();
  }
  function openEditSheet(item) {
    state.sheet = { mode: 'edit', item: Object.assign({}, item), uploading: false };
    render();
  }
  function closeSheet() { state.sheet = null; render(); }

  function syncFormFieldsToSheetItem() {
    var form = root.querySelector('#item-form');
    if (!form || !state.sheet) return;
    var fd = new FormData(form);
    state.sheet.item.title = fd.get('title') || state.sheet.item.title;
    state.sheet.item.description = fd.get('description') != null ? fd.get('description') : state.sheet.item.description;
    state.sheet.item.price = fd.get('price') != null ? fd.get('price') : state.sheet.item.price;
    state.sheet.item.url = fd.get('url') != null ? fd.get('url') : state.sheet.item.url;
  }

  async function handleImageFile(file) {
    if (!file) return;
    syncFormFieldsToSheetItem();
    state.sheet.uploading = true;
    render();
    try {
      var dataUrl = await compressImageFile(file);
      state.sheet.item.image = dataUrl;
    } catch (e) {
      showToast(e.message || 'No se pudo procesar la imagen');
    } finally {
      state.sheet.uploading = false;
      render();
    }
  }
  function removeSheetImage() { syncFormFieldsToSheetItem(); state.sheet.item.image = ''; render(); }

  async function saveSheet(formData) {
    var title = (formData.title || '').trim();
    if (!title) { showToast('Poné un título para el deseo'); return; }
    var now = Date.now();
    if (state.sheet.mode === 'add') {
      state.items.push({
        id: uid(),
        owner: state.session,
        title: title.slice(0, 200),
        description: (formData.description || '').trim().slice(0, 1000),
        url: (formData.url || '').trim().slice(0, 500),
        price: (formData.price || '').trim().slice(0, 50),
        image: formData.image || '',
        reserved: false,
        reservedBy: null,
        createdAt: now
      });
      closeSheet();
      showToast('¡Agregado a tu lista! 🎉');
    } else {
      var idx = state.items.findIndex(function (it) { return it.id === state.sheet.item.id; });
      if (idx !== -1) {
        var it = state.items[idx];
        it.title = title.slice(0, 200);
        it.description = (formData.description || '').trim().slice(0, 1000);
        it.url = (formData.url || '').trim().slice(0, 500);
        it.price = (formData.price || '').trim().slice(0, 50);
        it.image = formData.image || '';
      }
      closeSheet();
      showToast('Cambios guardados');
    }
    render();
    await publishItems();
  }

  async function deleteItem(id) {
    state.items = state.items.filter(function (it) { return it.id !== id; });
    closeSheet();
    showToast('Eliminado');
    render();
    await publishItems();
  }

  async function toggleReserve(item) {
    var idx = state.items.findIndex(function (it) { return it.id === item.id; });
    if (idx === -1) return;
    var reserved = !state.items[idx].reserved;
    state.items[idx].reserved = reserved;
    state.items[idx].reservedBy = reserved ? state.session : null;
    render();
    await publishItems();
  }

  function openConfirm(message, onConfirm) { state.confirm = { message: message, onConfirm: onConfirm }; render(); }
  function closeConfirm() { state.confirm = null; render(); }

  // ---------- Render ----------
  function itemThumb(item) {
    if (item.image) return '<div class="item-thumb"><img src="' + escapeHtml(item.image) + '" alt="" onerror="this.parentElement.innerHTML=\'🎁\'"/></div>';
    return '<div class="item-thumb">🎁</div>';
  }

  function themeClass(theme) { return theme === 'blue' ? 'theme-blue' : 'theme-pink'; }

  function renderItemCard(item, mode, index) {
    var meta = '<div class="item-meta">' +
      (item.price ? '<span class="item-price">' + escapeHtml(formatPrice(item.price)) + '</span>' : '') +
      (item.url ? '<a class="item-link" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">Ver enlace ↗</a>' : '') +
      '</div>';
    var extra = '', actions = '';
    if (mode === 'mine') {
      actions = '<div class="item-actions">' +
        '<button class="icon-btn" data-action="edit" data-id="' + item.id + '">✏️</button>' +
        '<button class="icon-btn danger" data-action="delete" data-id="' + item.id + '">🗑️</button>' +
        '</div>';
    } else {
      if (item.reserved && item.reservedBy === state.session) {
        extra = '<div class="reserve-btn reserved" data-action="unreserve" data-id="' + item.id + '">✅ Lo vas a regalar tú</div>';
      } else if (item.reserved) {
        extra = '<div class="reserved-by-other">🎁 Ya está reservado</div>';
      } else {
        extra = '<button class="reserve-btn" data-action="reserve" data-id="' + item.id + '">🎁 Yo lo regalo</button>';
      }
    }
    var delay = Math.min(index || 0, 8) * 0.05;
    return '<div class="item-card card-enter" style="animation-delay:' + delay + 's">' +
      itemThumb(item) +
      '<div class="item-body">' +
      '<div class="item-title">' + escapeHtml(item.title) + '</div>' +
      (item.description ? '<div class="item-desc">' + escapeHtml(item.description) + '</div>' : '') +
      meta + extra +
      '</div>' + actions +
      '</div>';
  }

  function renderLoginProfiles() {
    var cards = Object.values(PROFILES).map(function (p) {
      return '<button class="profile-card ' + themeClass(p.theme) + '" data-action="open-pin" data-id="' + p.id + '">' +
        '<div class="profile-avatar">' + p.emoji + '</div>' +
        '<div><div class="profile-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="profile-hint">Toca para entrar</div></div></button>';
    }).join('');
    return '<div class="screen-login">' +
      '<div class="login-title">Nuestra<br/>Wishlist 💫</div>' +
      '<div class="login-subtitle">Elige tu perfil para entrar</div>' +
      '<div class="profile-cards">' + cards + '</div>' +
      '</div>';
  }

  function renderPinScreen() {
    var p = state.pinTarget;
    var dots = [0, 1, 2, 3].map(function (i) {
      var filled = i < state.pinBuffer.length;
      var cls = state.pinError ? 'error' : (filled ? 'filled' : '');
      return '<div class="pin-dot ' + cls + '"></div>';
    }).join('');
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    var keypad = keys.map(function (k) {
      if (k === '') return '<div></div>';
      if (k === 'back') return '<button class="pin-key ghost" data-action="pin-back">⌫</button>';
      return '<button class="pin-key" data-action="pin-digit" data-digit="' + k + '">' + k + '</button>';
    }).join('');
    return '<div class="screen-pin">' +
      '<button class="pin-back" data-action="pin-cancel">‹ Volver</button>' +
      '<div class="pin-avatar ' + themeClass(p.theme) + '">' + p.emoji + '</div>' +
      '<div class="pin-greeting">Hola, ' + escapeHtml(p.name) + '</div>' +
      '<div class="pin-instruction">Ingresa tu clave de 4 dígitos</div>' +
      '<div class="pin-dots">' + dots + '</div>' +
      '<div class="pin-keypad">' + keypad + '</div>' +
      '</div>';
  }

  function renderListControls(count) {
    if (count === 0) return '';
    var sorts = [
      { id: 'recent', label: 'Recientes' },
      { id: 'price-asc', label: 'Precio ↑' },
      { id: 'price-desc', label: 'Precio ↓' }
    ];
    var chips = sorts.map(function (s) {
      return '<button class="sort-chip ' + (state.sortBy === s.id ? 'active' : '') + '" data-action="sort" data-sort="' + s.id + '">' + s.label + '</button>';
    }).join('');
    return '<div class="list-controls">' +
      '<div class="search-box"><span class="search-icon">🔍</span>' +
      '<input type="text" id="search-input" class="search-input" data-action="search" placeholder="Buscar en la lista..." value="' + escapeHtml(state.search) + '" /></div>' +
      '<div class="sort-chips">' + chips + '</div>' +
      '</div>';
  }

  function renderDashboard() {
    var mode = state.activeTab;
    var partnerName = PROFILES[partnerId()].name;
    var rawItems = mode === 'mine' ? myItems() : partnerItems();
    var list;
    if (rawItems.length === 0) {
      list = '<div class="empty-state"><div class="empty-emoji">' + (mode === 'mine' ? '📝' : '🎁') + '</div>' +
        '<div>' + (mode === 'mine' ? 'Aún no agregaste nada.<br/>Toca + para empezar.' : escapeHtml(partnerName) + ' no tiene deseos todavía.') + '</div></div>';
    } else {
      var items = filterAndSort(rawItems);
      var cards = items.length
        ? items.map(function (it, i) { return renderItemCard(it, mode, i); }).join('')
        : '<div class="empty-state small"><div class="empty-emoji">🔎</div><div>Nada coincide con "' + escapeHtml(state.search) + '"</div></div>';
      list = renderListControls(rawItems.length) + '<div class="items-list">' + cards + '</div>';
    }
    var profile = PROFILES[state.session];
    return '<div class="screen-dashboard">' +
      '<div class="dash-header"><div>' +
      '<div class="dash-greeting">Hola, ' + escapeHtml(profile.name) + ' ' + profile.emoji + '</div>' +
      '<div class="dash-sub">' + (mode === 'mine' ? 'Estos son tus deseos' : 'Los deseos de ' + escapeHtml(partnerName)) + '</div>' +
      '</div><button class="logout-btn" data-action="logout">⏻</button></div>' +
      '<div class="tabs">' +
      '<button class="tab-btn ' + (mode === 'mine' ? 'active' : '') + '" data-action="tab" data-tab="mine">Mi lista</button>' +
      '<button class="tab-btn ' + (mode === 'partner' ? 'active' : '') + '" data-action="tab" data-tab="partner">' + escapeHtml(partnerName) + '</button>' +
      '</div>' + list +
      (mode === 'mine' ? '<button class="fab" data-action="add">+</button>' : '') +
      '<div class="bottom-nav">' +
      '<button class="nav-item ' + (mode === 'mine' ? 'active' : '') + '" data-action="tab" data-tab="mine"><span class="nav-icon">🏠</span>Mi lista</button>' +
      '<button class="nav-item ' + (mode === 'partner' ? 'active' : '') + '" data-action="tab" data-tab="partner"><span class="nav-icon">💌</span>' + escapeHtml(partnerName) + '</button>' +
      '<button class="nav-item" data-action="logout"><span class="nav-icon">⏻</span>Salir</button>' +
      '</div></div>';
  }

  function renderImageField(item, uploading) {
    if (item.image) {
      return '<div class="field"><label>Foto</label><div class="image-preview">' +
        '<img src="' + escapeHtml(item.image) + '" alt="" />' +
        '<button type="button" class="image-remove" data-action="remove-image">🗑️ Quitar</button>' +
        '</div></div>';
    }
    return '<div class="field"><label>Foto (opcional)</label>' +
      '<label class="upload-btn ' + (uploading ? 'disabled' : '') + '">' +
      (uploading ? 'Procesando...' : '📷 Subir foto desde tu celular') +
      '<input type="file" accept="image/*" data-action="image-file" ' + (uploading ? 'disabled' : '') + ' hidden /></label>' +
      '<input type="url" id="image-url-input" name="image" placeholder="o pegá un link de imagen" maxlength="1000" />' +
      '</div>';
  }

  function renderSheet() {
    if (!state.sheet) return '';
    var mode = state.sheet.mode, item = state.sheet.item, uploading = state.sheet.uploading;
    return '<div class="sheet-overlay" data-action="sheet-overlay"><div class="sheet">' +
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-title">' + (mode === 'add' ? 'Nuevo deseo' : 'Editar deseo') + '</div>' +
      '<form id="item-form">' +
      '<div class="field"><label>¿Qué deseas?</label>' +
      '<input type="text" id="field-title" name="title" placeholder="Ej. Zapatillas rosas" value="' + escapeHtml(item.title) + '" required maxlength="200" /></div>' +
      '<div class="field"><label>Descripción (opcional)</label>' +
      '<textarea id="field-description" name="description" placeholder="Talla, color, detalles..." maxlength="1000">' + escapeHtml(item.description) + '</textarea></div>' +
      '<div class="field-row"><div class="field"><label>Precio aprox. (Bs)</label>' +
      '<input type="text" id="field-price" name="price" placeholder="Bs 350" value="' + escapeHtml(item.price) + '" maxlength="50" /></div></div>' +
      '<div class="field"><label>Link de la tienda (opcional)</label>' +
      '<input type="url" id="field-url" name="url" placeholder="https://..." value="' + escapeHtml(item.url) + '" maxlength="500" /></div>' +
      renderImageField(item, uploading) +
      '<div class="sheet-actions">' +
      '<button type="button" class="btn btn-secondary" data-action="sheet-cancel">Cancelar</button>' +
      '<button type="submit" class="btn btn-primary">Guardar</button>' +
      '</div>' +
      (mode === 'edit' ? '<div class="sheet-actions" style="margin-top:10px">' +
        '<button type="button" class="btn btn-danger-text" data-action="sheet-delete" data-id="' + item.id + '">Eliminar deseo</button></div>' : '') +
      '</form></div></div>';
  }

  function renderConfirmDialog() {
    if (!state.confirm) return '';
    return '<div class="confirm-overlay" data-action="confirm-overlay"><div class="confirm-box">' +
      '<div class="confirm-message">' + escapeHtml(state.confirm.message) + '</div>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="btn btn-secondary" data-action="confirm-cancel">Cancelar</button>' +
      '<button type="button" class="btn btn-danger-solid" data-action="confirm-yes">Eliminar</button>' +
      '</div></div></div>';
  }

  function render() {
    var html = '';
    if (!state.session) {
      html = state.pinTarget ? renderPinScreen() : renderLoginProfiles();
    } else {
      html = renderDashboard();
    }
    html += renderSheet();
    html += renderConfirmDialog();
    if (state.toast) html += '<div class="toast">' + escapeHtml(state.toast) + '</div>';
    root.innerHTML = html;
    bindEvents();
  }

  function bindEvents() {
    var actionEls = root.querySelectorAll('[data-action]');
    for (var i = 0; i < actionEls.length; i++) {
      (function (elm) {
        var action = elm.getAttribute('data-action');
        if (action === 'open-pin') {
          elm.addEventListener('click', function () { openPin(PROFILES[elm.getAttribute('data-id')]); });
        } else if (action === 'pin-cancel' || action === 'pin-back') {
          elm.addEventListener('click', backToProfiles);
        } else if (action === 'pin-digit') {
          elm.addEventListener('click', function () { pressDigit(elm.getAttribute('data-digit')); });
        } else if (action === 'logout') {
          elm.addEventListener('click', logout);
        } else if (action === 'tab') {
          elm.addEventListener('click', function () { switchTab(elm.getAttribute('data-tab')); });
        } else if (action === 'add') {
          elm.addEventListener('click', openAddSheet);
        } else if (action === 'edit') {
          elm.addEventListener('click', function () {
            var item = myItems().find(function (it) { return it.id === elm.getAttribute('data-id'); });
            if (item) openEditSheet(item);
          });
        } else if (action === 'delete') {
          elm.addEventListener('click', function () {
            var id = elm.getAttribute('data-id');
            openConfirm('¿Eliminar este deseo? No se puede deshacer.', function () { deleteItem(id); });
          });
        } else if (action === 'sheet-delete') {
          elm.addEventListener('click', function () {
            var id = elm.getAttribute('data-id');
            openConfirm('¿Eliminar este deseo? No se puede deshacer.', function () { deleteItem(id); });
          });
        } else if (action === 'confirm-yes') {
          elm.addEventListener('click', function () {
            var cb = state.confirm && state.confirm.onConfirm;
            closeConfirm();
            if (cb) cb();
          });
        } else if (action === 'confirm-cancel' || action === 'confirm-overlay') {
          elm.addEventListener('click', function (evt) {
            if (action === 'confirm-overlay' && evt.target !== elm) return;
            closeConfirm();
          });
        } else if (action === 'search') {
          elm.addEventListener('input', function () {
            var cursorPos = elm.selectionStart;
            state.search = elm.value;
            render();
            var ni = document.getElementById('search-input');
            if (ni) { ni.focus(); ni.setSelectionRange(cursorPos, cursorPos); }
          });
        } else if (action === 'sort') {
          elm.addEventListener('click', function () { state.sortBy = elm.getAttribute('data-sort'); render(); });
        } else if (action === 'reserve' || action === 'unreserve') {
          elm.addEventListener('click', function () {
            var item = partnerItems().find(function (it) { return it.id === elm.getAttribute('data-id'); });
            if (item) toggleReserve(item);
          });
        } else if (action === 'sheet-cancel') {
          elm.addEventListener('click', closeSheet);
        } else if (action === 'sheet-overlay') {
          elm.addEventListener('click', function (evt) { if (evt.target === elm) closeSheet(); });
        } else if (action === 'image-file') {
          elm.addEventListener('change', function () { handleImageFile(elm.files[0]); });
        } else if (action === 'remove-image') {
          elm.addEventListener('click', removeSheetImage);
        }
      })(actionEls[i]);
    }

    var form = root.querySelector('#item-form');
    if (form) {
      form.addEventListener('submit', function (evt) {
        evt.preventDefault();
        var fd = new FormData(form);
        var imageUrlField = fd.get('image');
        saveSheet({
          title: fd.get('title'),
          description: fd.get('description'),
          price: fd.get('price'),
          url: fd.get('url'),
          image: state.sheet.item.image || (typeof imageUrlField === 'string' ? imageUrlField : '')
        });
      });
    }
  }

  render();
})();
</script>
